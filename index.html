<meta name="theme-color" content="#23282f">
<title>Production Planner Wireframe</title>
<meta name="" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a framed app shell (sidebar, top bar, scrolling content) on a grey canvas, with a yellow sticky note
   for the test task. One light wireframe palette on purpose, so every tester sees exactly the same screens. */
:root{
  color-scheme: light;
  --canvas:#e6e8eb; --surface:#ffffff; --sunken:#f5f6f7; --fill:#e4e7ea; --fill-2:#d2d6db;
  --line:#d3d7dc; --line-2:#99a0a8; --ink:#1c2025; --muted:#59606a; --faint:#878e97;
  --act:#23282f; --act-hover:#3b424c; --act-ink:#ffffff;
  --err:#b42318; --err-bg:#fdedeb; --err-line:#e7b4ae;
  --note:#fff3a8; --note-line:#e3cd62; --note-ink:#3a3412;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 var(--sans);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono)}
.hint{color:var(--muted);font-size:12.5px}
.msg{color:var(--err);font-size:12.5px}
.msg:empty{display:none}
.lbl{font-weight:500;font-size:13px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons and inputs */
.btn{font:inherit;font-weight:500;font-size:13.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:var(--r);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--fill)}
.btn.primary{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.btn.primary:hover{background:var(--act-hover)}
.btn[disabled],.btn[disabled]:hover{opacity:.42;cursor:not-allowed;background:var(--surface);color:var(--ink)}
.btn.primary[disabled],.btn.primary[disabled]:hover{background:var(--act);color:var(--act-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--fill)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--err);border-color:var(--err-line)}
.btn.wide{width:100%}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:600}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.in{font:inherit;font-size:14px;border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.in.sm{padding:4px 8px;font-size:13px;width:auto}
.in.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.in.err{border-color:var(--err);background:var(--err-bg)}
.in[disabled]{background:var(--fill);color:var(--faint)}
select.in{padding-right:28px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:500;font-size:13px}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--act);margin:0}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.checks.err{border-color:var(--err);background:var(--err-bg)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;font-size:12px;background:var(--surface);white-space:nowrap;line-height:1.5}
.chip.dark{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.chip.err{color:var(--err);border-color:var(--err-line);background:var(--err-bg)}
.chip.sm{font-size:11px;padding:0 6px}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--line-2);display:inline-block;flex:none;vertical-align:-1px}
.sw.spotty{background:radial-gradient(circle at 32% 34%,#8f80bd 0 1.6px,transparent 2px),radial-gradient(circle at 68% 66%,#8f80bd 0 1.6px,transparent 2px),#fff}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:216px minmax(0,1fr);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:14px;overflow:auto;background:var(--surface)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;padding:2px 6px}
.logo{width:28px;height:28px;border:1.5px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:500}
.menu{display:flex;flex-direction:column;gap:2px}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500}
.mi:hover{background:var(--sunken);color:var(--ink)}
.mi.on{background:var(--fill);color:var(--ink)}
.mi:focus-visible{outline:2px solid var(--act)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{flex:none;min-height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 20px;flex-wrap:wrap}
.crumb{font-weight:600}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.today{font-size:12px;color:var(--muted);padding-right:8px;border-right:1px solid var(--line)}
.content{flex:1;overflow:auto;padding:22px 24px 140px;background:var(--sunken);min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px}
.ph .hint{margin-top:3px;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px 12px;justify-content:space-between;flex-wrap:wrap}
.panel-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.panel-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:14px}
.inl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.banner{display:flex;align-items:flex-start;gap:12px 16px;padding:11px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);margin-bottom:14px;flex-wrap:wrap}
.banner > div{flex:1;min-width:220px}
.banner.info{border-style:dashed;background:var(--sunken)}
.banner.err{border-color:var(--err-line);background:var(--err-bg);color:var(--err)}
.banner ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.flag{color:var(--err);font-size:12px;font-weight:500;line-height:1.35}
.scroll-x{overflow-x:auto}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--fill);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunken)}
.tbl tr.sel td{background:var(--fill)}
.tbl tr.flash td{animation:flash 2.4s ease-out}
.tbl tr.off td{color:var(--faint)}
.tbl .n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl th.n{font-family:var(--sans)}
.tbl td.sub{background:var(--sunken);padding:4px 10px 10px 34px}
.tbl tr.err td{color:var(--err)}
@keyframes flash{0%,35%{background:var(--note)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.tbl tr.flash td{animation:none;background:var(--note)}}

/* calendar */
.board{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;align-items:stretch}
.col{flex:0 0 226px;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.col.now{border-color:var(--line-2)}
.col.bad{border:2px solid var(--err)}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.col-t{display:flex;align-items:center;gap:6px;justify-content:space-between}
.col-b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:180px}
.col-f{border-top:1px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:7px;background:var(--sunken);border-radius:0 0 8px 8px}
.act{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);cursor:pointer;font-size:12.5px;line-height:1.35}
.act:hover{border-color:var(--line-2);background:var(--sunken)}
.act:focus-visible{outline:2px solid var(--act);outline-offset:1px}
.act.moved{border-style:dashed}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted)}
.act-t{font-weight:600}
.act-w{color:var(--muted);font-size:11.5px}
.use{display:flex;flex-direction:column;gap:3px;font-size:12px}
.use-t{display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--line-2)}
.bar.over > i{background:var(--err)}
.empty{padding:10px 4px;text-align:center}

/* targets */
.strip{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 12px;scroll-snap-type:x proximity}
.wk{all:unset;box-sizing:border-box;flex:0 0 128px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;min-height:112px;scroll-snap-align:start}
.wk:hover{border-color:var(--line-2)}
.wk:focus-visible{outline:2px solid var(--act);outline-offset:1px}
.wk.empty{border-style:dashed;background:var(--sunken)}
.wk.sel{border:2px solid var(--act);padding:9px;background:var(--surface)}
.wk.flashy{animation:flashbox 2.4s ease-out}
@keyframes flashbox{0%,35%{background:var(--note)}100%{}}
.wk-t{display:flex;align-items:center;justify-content:space-between;gap:4px}
.wk-n{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:auto}
.wk-none{color:var(--faint);font-size:12.5px;margin-top:auto}
.mixbar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--fill);gap:1px}
.mixbar > i{display:block;height:100%;border:0}
.mixbar.big{height:14px;border:1px solid var(--line-2);gap:0}
.mixbar.big > i{border-right:1px solid var(--line-2)}
.period{display:flex;align-items:center;gap:6px;font-size:13px}
.period .in{width:62px;text-align:center}
.mixrow{display:grid;grid-template-columns:minmax(120px,170px) 108px minmax(110px,1fr) auto;align-items:center;gap:10px 14px;padding:9px 0;border-bottom:1px solid var(--fill)}
.mixrow:last-child{border-bottom:0}
.pct{display:flex;align-items:center;gap:6px}
.pct .in{width:70px}
.cname{display:flex;align-items:center;gap:8px;font-weight:500}
.sumline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.status{font-weight:500}
.status.bad{color:var(--err)}

/* varieties + gardens */
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.chart .in{width:74px}
.chart td,.chart th{padding:6px 8px}
.chart .na{color:var(--faint);font-size:12px}
.gardens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px;align-items:start}
.phs{display:flex;flex-wrap:wrap;gap:4px}
.inlineform{border:1px dashed var(--line-2);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--sunken)}

/* weekly actions */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:var(--surface);padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--act);color:var(--act-ink)}
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.day.today{border:2px solid var(--act)}
.day.past .day-g{opacity:.72}
.day-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.day-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.dg{padding:10px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.dg + .dg{border-left:1px solid var(--fill)}
.wa{border-left:3px solid var(--line-2);padding:2px 0 2px 9px}

/* overlays */
.backdrop{position:fixed;inset:0;background:rgba(24,28,33,.32);z-index:30;display:flex}
.drawer-wrap{justify-content:flex-end}
.drawer{width:min(500px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line-2);display:flex;flex-direction:column;box-shadow:-10px 0 28px rgba(0,0,0,.14);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-b{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal-wrap{z-index:60;align-items:center;justify-content:center;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100% - 32px);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.modal .drawer-b{gap:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.confirm{border:1px dashed var(--line-2);background:var(--sunken);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;top:calc(26px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;background:var(--act);color:var(--act-ink);
  padding:10px 16px 10px 12px;border-radius:8px;display:flex;align-items:center;gap:9px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.22);max-width:calc(100% - 32px)}
.toast .ic{stroke-width:2}

/* login, intro */
.frame{height:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:auto;display:grid;place-items:center;padding:24px 16px}
.login{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login h1{margin-top:6px}
.intro{width:min(660px,100%);display:flex;flex-direction:column;gap:16px;padding-block:12px}
.intro h1{font-size:28px;line-height:1.15}
.intro p{max-width:62ch}
.intro ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.intro .row{display:flex;gap:10px;flex-wrap:wrap}
details.fac{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.fac summary{cursor:pointer;font-weight:500}
.tasklist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasklist li{display:flex;align-items:center;gap:10px;justify-content:space-between}

/* sticky note: the test task */
.note{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:312px;max-width:calc(100% - 56px);max-height:min(72vh,620px);overflow:auto;
  background:var(--note);border:1px solid var(--note-line);color:var(--note-ink);border-radius:3px;box-shadow:0 8px 22px rgba(60,52,10,.22);padding:12px 14px 14px;z-index:50;
  display:flex;flex-direction:column;gap:9px}
.note h2{font-size:16px}
.note p{font-size:13.5px}
.note-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.note .btn{border-color:var(--note-line);background:#fffbe0}
.note .btn:hover{background:#fff6c2}
.note .btn.primary{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.note-acts{display:flex;gap:8px;flex-wrap:wrap}
.note table{border-collapse:collapse;font-size:12.5px;width:100%}
.note td,.note th{padding:3px 6px;border-bottom:1px solid var(--note-line);text-align:left}
.note th{font-weight:500}
.note td.n{font-family:var(--mono);text-align:right}
.note.min{width:auto;padding:8px 10px;flex-direction:row;align-items:center}
.shell.tasking{grid-template-columns:332px minmax(0,1fr)}
.note.docked{position:static;width:auto;max-width:none;max-height:none;overflow:visible;margin-top:auto;box-shadow:0 3px 10px rgba(60,52,10,.14);flex:none}
.note.docked.min{justify-content:space-between}

@media (max-width:860px){
  html,body{height:auto}
  #app,.shell,.frame{height:auto;min-height:calc(100vh - 32px)}
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center}
  .menu{flex-direction:row;flex-wrap:wrap}
  .content{overflow:visible;padding:16px 14px 220px}
  .split,.grid2{grid-template-columns:1fr}
  .mixrow{grid-template-columns:1fr auto;}
  .note{left:16px;right:16px;width:auto;max-width:none;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:46vh}
  .shell.tasking{grid-template-columns:1fr}
  .note.docked{flex-basis:100%;margin-top:4px}
}
</style>
</head>
<body>

<script>

const DAY = 864e5;
const fmt = n => Number(n).toLocaleString("en-US");

const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);

const dec = v => { const s = String(v ?? "").trim().replace(",", ".").replace(/[^\d.]/g, ""); if (s === "" || s === ".") return null; const n = parseFloat(s); return isNaN(n) ? null : n; };
const plural = (n, a, b) => n === 1 ? a : (b || a + "s");

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const monday = w => new Date(W1 + (w - 1) * 7 * DAY);
const TODAY = new Date(Date.UTC(2027, 0, 13));   // prototype "today": Wednesday of week 2
const TODAY_WEEK = 2;
const dow = d => (d.getUTCDay() + 6) % 7;

const dm = d => d.getUTCDate() + " " + MON[d.getUTCMonth()];
const ddm = d => DOW[dow(d)] + " " + dm(d);
const weekOf = d => Math.floor((+d - W1) / (7 * DAY)) + 1;
function weekRange(w){ const a = monday(w), b = new Date(+a + 6 * DAY);
  return a.getUTCMonth() === b.getUTCMonth() ? `${a.getUTCDate()}–${dm(b)}` : `${dm(a)} – ${dm(b)}`; }
function weeksLabel(a, b){ return a === b ? `week ${a}` : `weeks ${a}–${b}`; }

};

/* ------------------------------------------------------------------ reference data */
const PHASES = ["stekken","oppotten","wijder zetten","koelen","afkweek","stokken"];
const COLORS = [
  {id:"white",  name:"White",  hex:"#ffffff"},
  {id:"yellow", name:"Yellow", hex:"#e3cd6b"},
  {id:"orange", name:"Orange", hex:"#dd9a5a"},
  {id:"pink",   name:"Pink",   hex:"#de9db7"},
  {id:"violet", name:"Violet", hex:"#9f8fca"},
  {id:"spotty", name:"Spotty", hex:"spotty"},
];
const colorOf = id => COLORS.find(c => c.id === id) || {name:id, hex:"#ccc"};
const sw = id => id === "spotty" ? '<span class="sw spotty"></span>' : `<span class="sw" style="background:${colorOf(id).hex}"></span>`;
const seg = (id, pct) => `<i style="width:${pct}%;background:${id === "spotty" ? "repeating-linear-gradient(90deg,#fff 0 3px,#9f8fca 3px 5px)" : colorOf(id).hex}"></i>`;

// From Planten.xlsx: duration in days and plants per m² per phase, for garden 1 and garden 5.
function V(name, color, family, d1, s1, k1, d5, o5, k5){
  return {name, color, family, loss: 10, g: {
    "1": {dur: d1, den: [s1, 142, 90, 90, 90, k1]},
    "5": {dur: [null, ...d5], den: [null, o5, 83, 83, 83, k5]} }};
}
const VARIETIES = [
  V("Albenga","yellow","Mineral Yellow",[7,115,50,70,41,12],325,69,[116,52,56,47,12],116,74),
  V("Bolgheri Lemon","yellow","Mineral Yellow",[7,115,36,70,36,12],325,69,[118,53,56,53,14],118,74),

  V("Camino Royale","violet","Mineral Violet",[7,119,41,70,34,12],329,69,[116,52,56,47,12],116,74),
  V("Chamonix","violet","Blossom",[7,110,44,70,42,12],325,69,[116,52,56,47,12],116,74),
  V("Presto Darling","violet","Diamond",[7,110,41,70,34,12],329,69,[116,52,56,47,12],116,74),
  V("Vienna","violet","Mineral Violet",[7,112,40,70,35,12],325,69,[109,48,56,48,10],109,74),
  V("Amabilis","white","Mineral White",[7,114,46,70,20,10],325,69,[116,52,56,47,12],116,74),
  V("Cotton Duchess","white","Niagara Fall",[7,119,45,70,32,12],329,90,[116,52,56,47,11],116,83),
  V("Nazare","white","Botanic",[7,116,44,70,38,12],325,90,[116,52,56,47,12],116,83),
  V("Zurich","white","Blossom",[7,110,41,70,33,11],325,69,[117,50,56,34,12],117,74),
];
VARIETIES.find(v => v.name === "Lima").loss = 15;

// From location2.ods: sections per garden, area in m².
const GARDENS = [
  {id:"1", name:"Garden 1", sections:[
    {id:"g1-stek", name:"G1 Stekkas", area:497, phases:["stekken"]},
    {id:"g1-opk12", name:"G1 Opkweek 1&2", area:10152, phases:["oppotten"]},
    {id:"g1-opk3", name:"G1 Opkweek 3", area:5594, phases:["wijder zetten"]},
    {id:"g1-koel", name:"G1 Koeling", area:8850, phases:["koelen"]},
    {id:"g1-afk", name:"G1 Afkweek Ongestokt vast", area:4588, phases:["afkweek"]},

    {id:"g1-stok", name:"G1 Afkweek Gestokt vast", area:2255, phases:["stokken"]} ]},
  {id:"5", name:"Garden 5", sections:[
    {id:"g5-opk12", name:"G5 Opkweek 1&2", area:5061, phases:["oppotten"]},
    {id:"g5-opk3", name:"G5 Opkweek 3", area:3937, phases:["wijder zetten"]},

             schedule: {state:"current", version:2, generated:"Tue 12 Jan 2027, 14:32"}, batches: []};

}
const has = r => S.user && S.user.roles.includes(r);
const varietyBy = name => D().varieties.find(v => v.name === name);
const gardenBy = id => D().gardens.find(g => g.id === id);

/* ------------------------------------------------------------------ planning model */
function sectionFor(gid, pi){
  const g = gardenBy(gid); if (!g) return null;
  const c = g.sections.filter(s => s.phases.includes(PHASES[pi]));
  c.sort((a, b) => a.phases.length - b.phases.length);   // dedicated sections first (Rule 3.3)
  return c[0] || null;
}
const canHost = (gid, pi, v) => !!sectionFor(gid, pi) && !!(v.g[gid] && v.g[gid].dur[pi]);
function defaultPG(b){ const v = varietyBy(b.variety); return PHASES.map((_, pi) => canHost(b.garden, pi, v) ? b.garden : "1"); }
const pgOf = b => b.pg || defaultPG(b);
function route(b, pgOverride){
  const v = varietyBy(b.variety), pg = pgOverride || pgOf(b);
  const ready = new Date(+monday(b.week) - DAY);           // ready the Sunday before the delivery week
  let end = +ready; const steps = new Array(6);
  for (let pi = 5; pi >= 0; pi--){
    const gid = pg[pi], gv = v.g[gid] || v.g["1"];
    const dur = gv.dur[pi], den = gv.den[pi], start = end - dur * DAY;
    steps[pi] = {pi, gid, sec: sectionFor(gid, pi), start: new Date(start), end: new Date(end), dur, den};
    end = start;
  }
  return {steps, ready};
}
const startedOf = b => Math.ceil(b.deliver / (1 - varietyBy(b.variety).loss / 100));
const isStarted = b => route(b).steps[0].start <= TODAY;
function makeBatches(){
  const names = D().varieties.map(v => v.name), L = []; let n = 0;
  const mk = (variety, garden, week, deliver) => ({id: "b" + (++n), variety, garden, week, deliver, pg: null});
  L.push(mk("Albenga", "1", 20, 10000));                   // Functional Design example 3.2.1
  for (let w = 14; w <= 44; w++){
    L.push(mk(names[(w * 5) % names.length], "1", w, 4000 + ((w * 37) % 9) * 500));
    L.push(mk(names[(w * 7 + 3) % names.length], "5", w, 3500 + ((w * 53) % 7) * 500));
  }
  return L;
}
function eventsOf(b){
  const s = route(b).steps, n = startedOf(b), ev = [];
  ev.push({b, type:"start", pi:0, date:s[0].start, to:s[0].sec, gid:s[0].gid, plants:n});
  for (let pi = 1; pi < 6; pi++) ev.push({b, type:"move", pi, date:s[pi].start, from:s[pi-1].sec, to:s[pi].sec, gid:s[pi].gid, plants:n});
  ev.push({b, type:"deliver", pi:6, date:monday(b.week), from:s[5].sec, gid:s[5].gid, plants:b.deliver});
  return ev;
}
const allEvents = () => D().batches.flatMap(eventsOf);
const secName = s => s ? s.name : "no section";
function evTitle(e){ return e.type === "start" ? "Start stekken" : e.type === "deliver" ? "Deliver" : "Move to " + PHASES[e.pi]; }
function evWhere(e){
  if (e.type === "start") return secName(e.to);
  if (e.type === "deliver") return "from " + secName(e.from) + ", week " + e.b.week;
  return secName(e.from) + " → " + secName(e.to);
}

// Space used per section per week (m²). Sample load, plus the effect of phases the planner moved.
function baseUse(sec, w){
  if (sec.added) return 0;
  if (sec.id === "g1-koel"){
    const o = {1:8420, 2:8700, 3: D().schedule.version === 2 ? 9050 : 8640, 4:8600, 5:8790, 6:8510};
    if (o[w] != null) return o[w];
  }
  let h = 0; for (const c of sec.id) h = (h * 31 + c.charCodeAt(0)) % 997;
  return Math.round(sec.area * (0.72 + ((w * 17 + h) % 19) / 100));
}
function computeDeltas(){
  const d = {};
  const add = (st, m2) => { if (!st.sec) return; const a = weekOf(st.start), z = weekOf(new Date(+st.end - 1));
    for (let w = a; w <= z; w++){ (d[st.sec.id] ||= {})[w] = ((d[st.sec.id] || {})[w] || 0) + m2; } };
  for (const b of D().batches){
    if (!b.pg) continue;
    const def = defaultPG(b), n = startedOf(b), cur = route(b), orig = route(b, def);
    for (let pi = 0; pi < 6; pi++){
      if (b.pg[pi] === def[pi]) continue;
      add(orig.steps[pi], -Math.ceil(n / orig.steps[pi].den));
      add(cur.steps[pi], Math.ceil(n / cur.steps[pi].den));
    }
  }
  return d;
}
const usage = (sec, w) => Math.max(0, baseUse(sec, w) + ((DELTA[sec.id] || {})[w] || 0));
function overSections(w){ const r = [];
  for (const g of D().gardens) for (const s of g.sections){ const u = usage(s, w); if (u > s.area) r.push({sec:s, used:u}); }
  return r; }
const expectedFor = w => { const t = D().targets[w]; if (!t) return null; return EXPECTED[w] != null ? Math.min(EXPECTED[w], t.total) : t.total; };
function shortWeek(w){ const t = D().targets[w], e = expectedFor(w); return D().schedule.version === 2 && t && e < t.total ? {target:t.total, expected:e} : null; }
function problems(weeks){
  const p = [];
  for (const w of weeks){
    for (const o of overSections(w)) p.push({w, kind:"over", text:`${o.sec.name} is ${fmt(o.used - o.sec.area)} m² over capacity`});
    const s = shortWeek(w);
    if (s) p.push({w, kind:"short", text:`the target can't be fully met: ${fmt(s.expected)} of ${fmt(s.target)} plants (${fmt(s.target - s.expected)} short)`});
  }
  return p;
}

/* ------------------------------------------------------------------ rendering */
// Every render replaces the page, so remember where the scrollable areas were and put them back
// (only when the same screen of the same task is shown again).
const SCROLLERS = [".strip", ".board", "#content"];
const ctxKey = () => `${S.mode}:${S.task}:${S.loggedIn}:${S.screen}`;
function snapScroll(){
  const c = document.getElementById("content"), d = document.querySelector(".drawer");
  const s = {ctx: c ? c.dataset.ctx : null, pos: {}, drawer: d ? [d.dataset.key, d.querySelector(".drawer-b").scrollTop] : null};
  for (const sel of SCROLLERS){ const el = document.querySelector(sel); if (el) s.pos[sel] = [el.scrollLeft, el.scrollTop]; }
  return s;
}
function restoreScroll(s){
  if (s.ctx && s.ctx === ctxKey()) for (const sel of SCROLLERS){ const el = document.querySelector(sel); if (el && s.pos[sel]){ el.scrollLeft = s.pos[sel][0]; el.scrollTop = s.pos[sel][1]; } }
  const d = document.querySelector(".drawer");
  if (d && s.drawer && d.dataset.key === s.drawer[0]) d.querySelector(".drawer-b").scrollTop = s.drawer[1];
}
function render(){
  const keep = snapScroll();
  DELTA = computeDeltas();
  const app = document.getElementById("app");
  if (S.mode === "intro") app.innerHTML = viewIntro();
  else if (S.mode === "end") app.innerHTML = viewEnd();
  else if (!S.loggedIn) app.innerHTML = viewLogin();
  else app.innerHTML = viewShell();
  // During a task the note sits in the sidebar; only on the login screen does it float.
  document.getElementById("note").innerHTML = S.mode === "task" && !S.loggedIn ? viewNote(false) : S.mode === "free" ? viewFreeTab() : "";
  document.getElementById("overlay").innerHTML = (S.loggedIn && (S.mode === "task" || S.mode === "free") ? viewDrawer() : "") + viewModal();
  restoreScroll(keep);
  afterRender();
}
function afterRender(){
  if (S.ui.scrollWeek){ const el = document.getElementById("wk-" + S.ui.scrollWeek); if (el) el.scrollIntoView({block:"nearest", inline:"center"}); S.ui.scrollWeek = null; }
  if (S.ui.scrollCol){ const el = document.getElementById("col-" + S.ui.scrollCol); if (el) el.scrollIntoView({block:"nearest", inline:"center"}); S.ui.scrollCol = null; }
  if (S.ui.focus){ const el = document.querySelector(S.ui.focus); if (el) el.focus(); S.ui.focus = null; }
  if (S.ui.flash){ setTimeout(() => { if (S.ui.flash){ S.ui.flash = null; } }, 2600); }
  if (S.ui.mix) mixLive();
  if (S.ui.modal && S.ui.modal.type === "req") reqLive();
  if (S.ui.vform) vformTotals();
}

  let banner = "";
  if (sch.state === "outdated"){

function colHtml(w, list, current){
  list.sort((a, b) => a.date - b.date || a.pi - b.pi);
  const over = current ? overSections(w) : [], short = current ? shortWeek(w) : null;
  return `<section class="col${over.length || short ? " bad" : ""}${w === TODAY_WEEK ? " now" : ""}" id="col-${w}" aria-label="Week ${w}">
    <div class="col-h"><div class="col-t"><b>Week ${w}</b>${w === TODAY_WEEK ? '<span class="chip dark sm">This week</span>' : ""}</div>

    <div class="col-f">${D().gardens.filter(g => g.sections.length).map(g => gardenUse(g, w)).join("")}
      ${over.map(o => `<div class="flag">${esc(o.sec.name)}: ${fmt(o.used - o.sec.area)} m² over capacity</div>`).join("")}
      <button class="btn sm" data-act="week" data-w="${w}">Space per section</button></div>
  </section>`;

function cardHtml(e){
  const v = varietyBy(e.b.variety), moved = !!e.b.pg;

function mixState(){
  const m = S.ui.mix, total = digits(m.total);
  const pct = Object.fromEntries(COLORS.map(c => [c.id, dec(m.pct[c.id]) || 0]));

  if (!total) status = "Enter the number of plants per week.";

  else if (sum > 100) status = `${fmt(Math.round((sum - 100) * 100) / 100)}% too much. The colors must add up to exactly 100%.`;
  else { status = "The colors add up to 100%."; ok = true; }

}

function saveVariety(){
  const f = S.ui.vform, e = {}, general = [];
  const name = f.name.trim(), family = f.family.trim(), loss = dec(f.loss);
  if (!name) e.name = "Enter a name.";
  else if (D().varieties.some(v => v.name.toLowerCase() === name.toLowerCase() && v.name !== f.orig)) e.name = "A variety with this name already exists.";
  if (!f.color) e.color = "Choose a color.";
  if (!family) e.family = "Enter a family.";
  if (loss == null || loss < 0 || loss > 99) e.loss = "Enter a loss percentage between 0 and 99.";
  const used = D().gardens.filter(g => f.use[g.id]);
  if (!used.length) e.gardens = "Select at least one garden.";
  for (const g of used) for (let pi = 0; pi < 6; pi++){
    if (!sectionFor(g.id, pi)) continue;
    if (!digits(f.dur[g.id][pi])) e[`dur.${g.id}.${pi}`] = 1;
    if (!digits(f.den[g.id][pi])) e[`den.${g.id}.${pi}`] = 1;
  }
  for (let pi = 0; pi < 6; pi++) if (used.length && !used.some(g => sectionFor(g.id, pi))) general.push(`${PHASES[pi][0].toUpperCase() + PHASES[pi].slice(1)} needs values in at least one garden that has a section for it.`);
  f.errors = e; f.general = general;
  if (Object.keys(e).length || general.length){ render(); const first = document.querySelector("#vform .err"); if (first) first.focus(); return; }
  const v = {name, color: f.color, family, loss, g: {}};
  for (const g of used) v.g[g.id] = {dur: PHASES.map((_, pi) => sectionFor(g.id, pi) ? digits(f.dur[g.id][pi]) : null), den: PHASES.map((_, pi) => sectionFor(g.id, pi) ? digits(f.den[g.id][pi]) : null)};
  if (f.orig){ const i = D().varieties.findIndex(x => x.name === f.orig); D().varieties[i] = v; D().batches.forEach(b => { if (b.variety === f.orig) b.variety = name; }); toast(`Changes to ${name} saved`); }

  S.ui.vsel = name; S.ui.vmode = "view"; S.ui.vform = null; S.ui.flash = "v:" + name; render();
}

const clock = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
function landing(){ for (const r of ROLE_ORDER) if (has(r)) return LANDING[r]; return "calendar"; }
function startTask(i){
  const t = TASKS[i];
  S.mode = "task"; S.task = i; S.panelOpen = true; S.ui = freshUi(); loadData(t.setup);
  S.user = {name: PERSONA[t.role], roles: [t.role]};
  S.loggedIn = !t.login; if (S.loggedIn) S.screen = landing();
  render(); window.scrollTo(0, 0);
}
function selectWeeks(a, b){
  a = Math.max(1, Math.min(52, a)); b = Math.max(1, Math.min(52, b));
  S.ui.tsel = {from: Math.min(a, b), to: Math.max(a, b)}; loadMix(); S.ui.scrollWeek = S.ui.tsel.from;
}
function commitTarget(weeks){
  const st = mixState(), m = S.ui.mix, T = D().targets;
  const req = {}; for (const [c, r] of Object.entries(m.req)) { const clean = Object.fromEntries(Object.entries(r).filter(([, v]) => dec(v))); if (Object.keys(clean).length && st.pct[c]) req[c] = Object.fromEntries(Object.entries(clean).map(([k, v]) => [k, dec(v)])); }
  for (const w of weeks) T[w] = {total: st.total, pct: {...st.pct}, req: clone(req)};
  D().schedule.state = "outdated"; D().schedule.changed = "Wed 13 Jan 2027, " + clock();
  S.ui.flash = "wk:" + weeks[0]; loadMix();
  return weeks;
}
function compactWeeks(ws){ const out = []; let a = ws[0], p = ws[0];
  for (const w of ws.slice(1).concat([null])){ if (w === p + 1){ p = w; continue; } out.push(a === p ? String(a) : `${a}–${p}`); a = p = w; }
  return out.join(", "); }

const ACT = {
  "start-task": el => startTask(+el.dataset.i),
  "free": () => { S.mode = "free"; S.ui = freshUi(); loadData(); S.user = {name: "Demo user", roles: ["planner","mgmt","staff","admin"]}; S.loggedIn = true; S.screen = landing(); render(); },
  "intro": () => { S.mode = "intro"; S.ui = freshUi(); S.loggedIn = false; render(); },
  "task-next": () => { if (S.task >= TASKS.length - 1){ S.mode = "end"; S.ui = freshUi(); S.loggedIn = false; render(); } else startTask(S.task + 1); },
  "task-restart": () => startTask(S.task),
  "task-list": () => { S.ui.modal = {type: "tasks"}; render(); },
  "note-toggle": () => { S.panelOpen = !S.panelOpen; render(); },
  "nav": el => { S.screen = el.dataset.id; S.ui.drawer = null; S.ui.secForm = null; if (S.screen === "varieties"){ S.ui.vmode = "view"; } render(); document.getElementById("content")?.scrollTo(0, 0); },
  "logout": () => { S.loggedIn = false; S.ui = freshUi(); render(); },
  "generate": () => { S.ui.generating = true; render();
    setTimeout(() => { const sch = D().schedule; sch.state = "current"; sch.version = 2; sch.generated = "Wed 13 Jan 2027, " + clock(); S.ui.generating = false;
      DELTA = computeDeltas(); const n = problems(range(1, 26)).length; toast(n ? `Schedule generated. ${n} ${plural(n, "problem")} found.` : "Schedule generated. No problems found."); render(); }, 1300); },
  "goto-week": el => { S.ui.scrollCol = +el.dataset.w; render(); },
  "week": el => { S.ui.drawer = {type: "week", w: +el.dataset.w}; S.ui.move = null; render(); },
  "batch": el => { S.ui.drawer = {type: "batch", id: el.dataset.id}; S.ui.move = null; render(); },
  "move-ask": el => { S.ui.move = {id: S.ui.drawer.id, pi: +el.dataset.pi}; render(); },
  "move-no": () => { S.ui.move = null; render(); },
  "move-yes": el => { const bt = D().batches.find(x => x.id === S.ui.move.id), pi = S.ui.move.pi; bt.pg = pgOf(bt).slice(); bt.pg[pi] = el.dataset.g;
    if (bt.pg.every((g, i) => g === defaultPG(bt)[i])) bt.pg = null;
    toast(`${PHASES[pi][0].toUpperCase() + PHASES[pi].slice(1)} of ${bt.variety} moved to ${sectionFor(el.dataset.g, pi).name}`); S.ui.move = null; render(); },
  "wk": (el, e) => { const w = +el.dataset.w; if (e.shiftKey && S.ui.tsel) selectWeeks(Math.min(S.ui.tsel.from, w), Math.max(S.ui.tsel.to, w)); else selectWeeks(w, w); S.ui.scrollWeek = null; render(); },
  "save-target": () => { const st = mixState(); if (!st.ok) return; const s = S.ui.tsel, ws = range(s.from, s.to);
    const existing = ws.filter(w => D().targets[w]);
    if (ws.length > 1 && existing.length){ S.ui.modal = {type: "overwrite", weeks: existing}; render(); return; }
    commitTarget(ws); toast(ws.length > 1 ? `Target saved for weeks ${s.from}–${s.to}` : `Target saved for week ${s.from}`); render(); },
  "ow-yes": () => { const s = S.ui.tsel; commitTarget(range(s.from, s.to)); S.ui.modal = null; toast(`Target saved for weeks ${s.from}–${s.to}`); render(); },
  "ow-keep": () => { const s = S.ui.tsel, keep = S.ui.modal.weeks, ws = range(s.from, s.to).filter(w => !keep.includes(w)); S.ui.modal = null;
    if (ws.length){ commitTarget(ws); toast(`Target saved for ${plural(ws.length, "week")} ${compactWeeks(ws)}. ${keep.length === 1 ? "Week " + keep[0] + " kept its" : "Weeks " + compactWeeks(keep) + " kept their"} existing target.`); }
    else toast("Nothing changed. All selected weeks kept their existing target."); render(); },
  "req-open": el => { S.ui.modal = {type: "req", color: el.dataset.c}; S.ui.reqDraft = Object.fromEntries(Object.entries(S.ui.mix.req[el.dataset.c] || {}).map(([k, v]) => [k, String(v)])); render(); reqLive(); },
  "req-done": () => { const c = S.ui.modal.color, clean = Object.fromEntries(Object.entries(S.ui.reqDraft).filter(([, v]) => dec(v)));
    if (Object.keys(clean).length) S.ui.mix.req[c] = clean; else delete S.ui.mix.req[c];
    S.ui.modal = null; render(); },
  "v-sel": el => { S.ui.vsel = el.dataset.name; S.ui.vmode = "view"; S.ui.vform = null; render(); },
  "v-new": () => { S.ui.vmode = "new"; S.ui.vform = newVform(null); S.ui.focus = "#v-name"; render(); vformTotals(); },
  "v-edit": () => { S.ui.vmode = "edit"; S.ui.vform = newVform(varietyBy(S.ui.vsel)); render(); vformTotals(); },
  "v-cancel": () => { S.ui.vmode = "view"; S.ui.vform = null; render(); },
  "v-save": () => saveVariety(),
  "g-add": () => { S.ui.modal = {type: "addgarden", name: ""}; S.ui.focus = "#g-name"; render(); },
  "g-add-save": () => { const m = S.ui.modal, name = (m.name || "").trim();
    if (!name){ m.err = "Enter a name."; render(); return; }
    if (D().gardens.some(g => g.name.toLowerCase() === name.toLowerCase())){ m.err = "There's already a garden with this name."; render(); return; }
    D().gardens.push({id: "g" + Date.now(), name, sections: []}); S.ui.modal = null; toast(`${name} added. Add a koeling before it can be used in a schedule.`); render(); },
  "sec-new": el => { S.ui.secForm = {garden: el.dataset.g, name: "", area: "", phases: [], errors: {}}; S.ui.focus = "#s-name"; render(); },
  "sec-cancel": () => { S.ui.secForm = null; render(); },
  "sec-save": () => saveSection(),
  "sec-del": el => { S.ui.modal = {type: "secdel", g: el.dataset.g, s: el.dataset.s}; render(); },
  "sec-del-yes": () => { const m = S.ui.modal, g = gardenBy(m.g), s = g.sections.find(x => x.id === m.s); g.sections = g.sections.filter(x => x.id !== m.s);
    D().schedule.state = "outdated"; D().schedule.changed = "Wed 13 Jan 2027, " + clock(); S.ui.modal = null; toast(`Section ${s.name} deleted`); render(); },
  "staff-week": el => { S.ui.staffWeek = +el.dataset.w; render(); },
  "exp-row": el => { const w = +el.dataset.w; S.ui.expOpen[w] = !S.ui.expOpen[w]; render(); },
  "u-new": () => { S.ui.uform = newUform(null); S.ui.drawer = {type: "user"}; S.ui.focus = "#u-name"; render(); },
  "u-edit": el => { S.ui.uform = newUform(D().users.find(u => u.id === el.dataset.id)); S.ui.drawer = {type: "user"}; render(); },
  "u-save": () => saveUser(),
  "close": () => closeTop(),
  "close-backdrop": () => closeTop(),
};
function closeTop(){ if (S.ui.modal){ S.ui.modal = null; S.ui.reqDraft = null; } else if (S.ui.drawer){ S.ui.drawer = null; S.ui.uform = null; S.ui.move = null; } render(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "close-backdrop" && e.target !== el) return;
  if (el.disabled) return;
  ACT[a] && ACT[a](el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (S.ui.modal || S.ui.drawer)) { closeTop(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("focusin", e => { if (e.target.matches("input.num, .period input")) e.target.select(); });
document.addEventListener("input", e => {
  const el = e.target, ds = el.dataset;
  if (ds.f && S.ui.vform){ const [k, g, i] = ds.f.split(".");
    if (k === "use") return;
    if (i != null) S.ui.vform[k][g][+i] = el.value; else S.ui.vform[k] = el.value;
    if (ds.live) vformTotals(); return; }
  if (ds.mix && S.ui.mix){ if (ds.mix === "total") S.ui.mix.total = el.value; else S.ui.mix.pct[ds.mix] = el.value; mixLive(); return; }
  if (ds.req && S.ui.reqDraft){ S.ui.reqDraft[ds.req] = el.value; reqLive(); return; }
  if (ds.sf && S.ui.secForm){ S.ui.secForm[ds.sf] = el.value; return; }
  if (ds.uf && S.ui.uform){ S.ui.uform[ds.uf] = el.value; return; }
  if (ds.gn && S.ui.modal){ S.ui.modal.name = el.value; return; }
  if (el.id === "l-email"){ S.ui.login.email = el.value; }
});
document.addEventListener("change", e => {
  const el = e.target, ds = el.dataset;
  if (ds.cal){ S.ui.cal[ds.cal] = el.value; render(); return; }
  if (ds.f && ds.f.startsWith("use.") && S.ui.vform){ S.ui.vform.use[ds.f.split(".")[1]] = el.checked; render(); vformTotals(); return; }
  if (ds.f === "color" && S.ui.vform){ S.ui.vform.color = el.value; return; }
  if (ds.tsel){ const s = S.ui.tsel || {}; const v = digits(el.value);
    let from = ds.tsel === "from" ? v : (s.from ?? v), to = ds.tsel === "to" ? v : (s.to ?? v);
    if (from && to && from > to){ if (ds.tsel === "from") to = from; else from = to; }   // keep the field you just typed in
    if (from && to) { selectWeeks(from, to); render(); } return; }
  if (ds.sfp && S.ui.secForm){ const p = ds.sfp, ph = S.ui.secForm.phases; if (el.checked) { if (!ph.includes(p)) ph.push(p); } else S.ui.secForm.phases = ph.filter(x => x !== p); return; }
  if (ds.ur && S.ui.uform){ const r = ds.ur, rs = S.ui.uform.roles; if (el.checked) { if (!rs.includes(r)) rs.push(r); } else S.ui.uform.roles = rs.filter(x => x !== r); return; }
  if (ds.ua && S.ui.uform){ S.ui.uform.active = el.checked; return; }
  if (ds.exp){ S.ui.expShort = el.checked; render(); return; }
});
document.addEventListener("focusout", e => { if (e.target.dataset.mix === "total" && S.ui.mix){ const n = digits(e.target.value); if (n){ S.ui.mix.total = fmt(n); e.target.value = fmt(n); } } });
document.addEventListener("submit", e => {
  if (e.target.id !== "login") return;
  e.preventDefault();
  const email = document.getElementById("l-email").value.trim(), pass = document.getElementById("l-pass").value, errs = {};
  if (!email) errs.email = "Enter your email address.";
  if (!pass) errs.pass = "Enter your password.";
  S.ui.login = {email, errors: errs};
  if (Object.keys(errs).length){ render(); return; }
  S.loggedIn = true; S.screen = landing(); render();
});

S = {mode: "intro", task: -1, panelOpen: true, loggedIn: false, user: null, screen: null, data: null, ui: freshUi()};
loadData();
render();
</script>
